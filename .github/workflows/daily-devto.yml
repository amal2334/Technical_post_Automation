name: Daily DEV.TO Post
on:
  schedule:
    - cron: '0 8 * * *'  # 9AM CET daily
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4  # ← KEY: v4 like Mastodon
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt  # ← KEY: Single line
    - run: python publish_devto.py
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
